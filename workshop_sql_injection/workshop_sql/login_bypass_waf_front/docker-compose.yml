version: '3.8'

services:
  sqli-waf-bypass-challenge:
    build: .
    container_name: sqli_waf_bypass_challenge
    ports:
      - "5001:5500"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
      - /data:mode=0777
    pids_limit: 100
    mem_limit: 512m